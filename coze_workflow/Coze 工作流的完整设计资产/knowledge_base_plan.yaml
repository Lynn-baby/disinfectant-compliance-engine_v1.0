# ============================================
# 知识库整理方案
# ============================================

# 你的知识库核心问题是：资料散落在 PDF/Excel/通话记录中，没有结构化。
# Coze 的知识库支持上传文档，但如果不先整理，检索效果会很差。

# 建议的分层知识库架构：

knowledge_base_structure:

  # ── 第1层: FAQ 知识库（最常用，直接匹配问答）──
  01_faq:
    format: "JSON/Q&A 对"
    source: 通话记录 + 销售经验
    examples:
      - q: "我的产品能不能做消字号备案？"
        a: |
          消字号备案的核心判断标准：产品本身是否具备消毒/抗菌功能。

          ✅ 可以备案的：
          - 消毒液、消毒器械（能自身产生消毒因子，如臭氧发生器、次氯酸电解槽）
          - 抗（抑）菌制剂（洗手液、抑菌喷雾等）

          ❌ 不可以备案的：
          - 纯雾化器/喷雾设备（只是把外面的消毒液喷出去）
          - 一般电子产品（按电子产品做安规即可）
          - 本身不产生消毒因子的设备

          不确定的话，您可以描述一下产品的工作原理，我帮您判断。

      - q: "检测需要多少钱？"
        a: |
          检测费用取决于检测项目和产品类型，大致参考范围：

          | 服务类型 | 费用范围 | 周期 |
          |---------|---------|------|
          | 基础杀菌检测 | 2000-5000元 | 15-20工作日 |
          | 空气消毒模拟现场 | 3000-8000元 | 20-30工作日 |
          | 病毒灭活检测 | 5000-12000元 | 30-40工作日 |
          | 全套安评备案 | 8000-20000元 | 2-3个月 |

          具体价格需要根据您的产品和检测项目确定，方便告诉我您是什么产品吗？

      - q: "需要做什么检测？"
        a: |
          根据产品类型不同，检测项目也不同：

          【消毒液/消毒剂】
          - 有效成分含量测定
          - pH值测定
          - 稳定性试验
          - 杀菌试验（金黄色葡萄球菌、大肠杆菌、白色念珠菌）
          - 模拟现场试验（按使用场景）
          - 病毒灭活试验（可选）

          【消毒器械】
          - 安规检测
          - 臭氧浓度/紫外线强度等输出参数
          - 模拟现场杀菌试验
          - 空气消毒效果试验

          【抗抑菌制剂】
          - 有效成分含量
          - 抑菌环试验
          - 多次皮肤刺激试验

          方便告诉我您具体是什么产品吗？我给您精准推荐。

      - q: "备案需要准备什么资料？"
        a: |
          消字号备案（卫生安全评价报告备案）需要以下资料：

          1. 卫生安全评价报告备案登记表
          2. 产品配方（含原料名称、CAS号、含量等）
          3. 产品说明书及标签（样稿）
          4. 检测报告（CMA/CNAS认证实验室出具）
          5. 企业标准（或国家标准/行业标准）
          6. 产品照片及市售标签
          7. 商标注册证或授权书
          8. 生产企业卫生许可证
          9. 代加工协议（如有代工）

          我们提供全套代办服务，您只需要提供基础资料就行。

      - q: "多久能办好？"
        a: |
          完整的消字号备案周期：

          检测阶段：15-45个工作日（取决于检测项目）
          ↓
          报告编写：7-10个工作日
          ↓
          备案申报：15-30个工作日
          ↓
          审批公示：7-15个工作日

          总计约 1.5-3 个月。

          加急服务可缩短约30%时间（需额外费用）。您时间上有什么要求吗？

  # ── 第2层: 备案规则知识库 ──
  02_filing_rules:
    source: 法规标准/ + 卫健委通知
    structure: |
      按产品类型分类：
      ├── 消毒剂备案规则
      ├── 消毒器械备案规则
      ├── 抗抑菌制剂备案规则
      └── 各地区差异（各地卫健委要求.xlsx）

  # ── 第3层: 检测标准知识库 ──
  03_testing_standards:
    source: 检测报告/ + 法规标准/最常用检测标准-最新/
    structure: |
      按标准编号分类：
      ├── GB 15979-2002 一次性使用卫生用品卫生标准
      ├── GB 15981-1995 消毒与灭菌效果的评价方法与标准
      ├── WS 628-2018 消毒产品卫生安全评价技术要求
      ├── 《消毒技术规范》(2002年版)
      └── 各产品检测标准速查表

  # ── 第4层: 报价知识库 ──
  04_pricing:
    source: 报价单/ + 报价汇总/
    structure: |
      结构化为表格：
      | 检测项目 | 标准 | 单价 | 样品数 | 正常周期 | 加急周期 | 加急费 |
      |---------|------|------|--------|---------|---------|-------|
      | ...    | ... | ...  | ...    | ...     | ...     | ...   |

  # ── 第5层: 客户案例库 ──
  05_case_library:
    source: 客户信息汇总/
    structure: |
      每个案例标准化为：
      {
        "客户名称": "成都宾奴",
        "产品类型": "消毒剂",
        "服务内容": "全套安评+备案",
        "挑战": "代加工形式，资料不齐全",
        "解决方案": "协助整理全套安评资料",
        "结果": "成功备案",
        "亮点": "代加工形式备案经验丰富"
      }

  # ── 第6层: 销售话术库 ──
  06_sales_scripts:
    source: cleaned_data/ (35通通话记录)
    structure: |
      按场景分类整理：
      ├── 开场白话术
      ├── 价格异议处理
      ├── 竞品对比回应
      ├── 推进成交话术
      └── 常见客户类型应对策略

# ============================================
# 知识库整理优先级
# ============================================

priority:
  P0_立即:
    - "01_faq 中的 5 个核心问答（上面已列出，可直接用）"
    - "备案可行性判断规则（check_filing_feasibility 所需数据）"
  P1_本周:
    - "检测项目→报价映射表"
    - "备案资料清单（按产品类型）"
    - "办理周期时间线"
  P2_两周内:
    - "10个典型案例"
    - "常用法规标准速查表"
    - "各地区卫健委要求差异"
