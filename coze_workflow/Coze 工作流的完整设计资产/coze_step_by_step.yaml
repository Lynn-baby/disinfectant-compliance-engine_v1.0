# ============================================
# Coze 平台实操步骤：从零搭建 Function Calling
# ============================================

# 假设你已经有一个 Coze Bot，没有的话先建一个。

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 第一步：准备知识库（先做这个，否则 function call 无数据可返）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

step_1_knowledge_base:
  操作路径: "Coze 控制台 → 知识库 → 新建知识库"
  知识库名称: "xx检测-销售知识库"

  上传方式: |
    不要直接上传 PDF/Excel！Coze 对非结构化文件检索效果很差。

    建议做法：
    1. 把核心信息整理成 TXT 或 Markdown 文件
    2. 每个文件控制在 2000 字以内（越大检索越不准）
    3. 按照 Q&A 格式写，问题写清楚，"问"和"答"分开

  第一批上传文件（已帮你准备好内容，直接复制到 TXT）:
    - 01_备案可行性判断.txt （内容见下方 faq_cheatsheet 的 Q1）
    - 02_检测项目速查.txt （内容见下方 faq_cheatsheet 的 Q2-Q3）
    - 03_报价指南.txt    （内容见下方 faq_cheatsheet 的 Q3-Q4）
    - 04_备案流程.txt    （内容见下方 faq_cheatsheet 的 Q4-Q5）
    - 05_法律法规速查.txt

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 第二步：配置 Bot 的 Persona (人设)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

step_2_bot_persona:
  操作路径: "Bot 设置 → 人设与回复逻辑"

  system_prompt: |
    # 角色
    你是xx检测的 AI 售前顾问，专门帮助消毒产品厂商解决产品检测、消字号备案和合规问题。

    # 核心能力
    1. 判断产品能否做消字号备案
    2. 推荐需要做的检测项目
    3. 提供检测报价和周期
    4. 说明备案所需资料和流程
    5. 引用法规标准解答合规问题

    # 工作原则
    - 客户说"产品"时，先问清楚产品类型和工作原理，不要直接给报价
    - 报价时先问预算范围，再推荐方案（经济型/标准型/全面型）
    - 技术问题从知识库检索，不确定的不要编，说"这个我需要和技术确认一下"
    - 每次回复末尾给出一个自然的下一步建议（加微信/发资料/约电话）
    - 语气：专业但像真实销售，不要太像机器人。可以适当加"咱们""您那边"这种口语

    # 禁止行为
    - 禁止编造价格、周期、法规要求（必须从知识库检索）
    - 禁止承诺 100% 通过备案
    - 禁止评价竞争对手

  # 关联知识库
  关联: "xx检测-销售知识库"（第一步创建的）

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 第三步：配置 Function Calling（核心）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

step_3_function_calling:

  # Coze 有两种方式实现 Function Calling：

  # ─── 方式A: 用"插件"机制（最简单，推荐起步用）───
  method_A_plugin:
    操作路径: "Bot 设置 → 插件"

    操作: |
      Coze 内置了"知识库检索"插件，你不需要自己写代码。
      1. 添加插件 → 搜索"知识库" → 选择"知识库查询"
      2. 配置：选择你创建的知识库

      这个插件的作用：
      用户提问 → Bot 自动从知识库检索相关内容 → 用检索结果回复

      优点：零代码，5分钟配好
      缺点：不够精细，不能做多步骤判断

  # ─── 方式B: 用 Workflow + 代码节点（功能更强，但需要写一点代码）───
  method_B_workflow:
    操作路径: "Bot 设置 → Workflow → 新建 Workflow"

    # Workflow 节点配置：

    node_1:
      名字: "意图识别"
      类型: "大模型节点"
      配置:
        prompt: |
          判断用户意图：
          - 问能不能备案 → FEASIBILITY
          - 问价格 → PRICING
          - 问检测项目 → TEST_ITEMS
          - 问资料 → DOCUMENTS
          - 问周期 → TIMELINE
          - 问法规 → REGULATION
          - 其他 → GENERAL

          只输出意图代码，不要其他内容。

    node_2:
      名字: "路由分发"
      类型: "条件判断节点"
      配置:
        条件1: "{{node_1.output}} == 'FEASIBILITY'"  → 跳 node_3_feasibility
        条件2: "{{node_1.output}} == 'PRICING'"     → 跳 node_3_pricing
        条件3: "{{node_1.output}} == 'TEST_ITEMS'"  → 跳 node_3_test_items
        # ... 以此类推

    node_3_feasibility:
      名字: "备案可行性判断"
      类型: "知识库节点"（或"代码节点"）

      # 如果用代码节点（更精确），写以下逻辑：
      代码(Python): |
        import json

        def main(user_input):
            # 备案判断规则（硬编码，因为规则固定）
            rules = {
                "可以备案": ["消毒液", "消毒剂", "抗抑菌制剂", "消毒器械(自身产生消毒因子)"],
                "不可以备案": ["纯雾化器", "纯喷雾设备", "普通电子设备", "不产生消毒因子的设备"],
                "需进一步确认": ["UVC+臭氧", "过滤+杀菌", "组合产品"]
            }

            # 关键词匹配（简单的规则引擎）
            result = {"feasible": "不确定", "reason": "需要更多信息"}

            # 这里的逻辑可以从知识库检索 + 规则匹配
            # 实际配置时把这段替换为知识库检索

            return result

    node_4:
      名字: "组装回复"
      类型: "大模型节点"
      配置:
        prompt: |
          根据以下信息，生成一段销售回复：

          用户问题：{{start.input}}
          检索结果：{{上一个节点的输出}}

          要求：先直接回答问题，再给建议，最后引导下一步。

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 第四步：测试和调试
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

step_4_testing:

  test_cases:
    - input: "你好"
      expected: 打招呼，介绍自己的能力

    - input: "我这个雾化器配合次氯酸消毒液能做消字号吗"
      expected: 判断为不可备案，解释原因，建议做安规替代

    - input: "消毒液检测多少钱"
      expected: 反问产品具体类型，再给报价范围

    - input: "备案需要准备什么"
      expected: 列出资料清单，询问产品类型

    - input: "你们做过空气消毒机的备案吗"
      expected: 匹配相关案例，建立信任

  # 测试步骤:
  # 1. 在 Coze Bot 预览窗口逐条输入上面 test_cases
  # 2. 看 Bot 回复是否准确、完整
  # 3. 不准确的，回去调 System Prompt 或知识库内容
  # 4. 重复测试直到满意

# ============================================
# 搭配你的 index.html 前端使用
# ============================================

frontend_integration:
  note: |
    你已有的 ai-sales-agent/index.html 是直接调 LLM API 的。
    Coze bot 搭建好后，有两个选择：

    选择A：直接用 Coze 的聊天界面（最简单）
    选择B：把 index.html 的 API 地址改为 Coze Bot API
      - Coze 提供 API 端点，可以把你的前端连到 Coze bot
      - 这样既有你定制的前端界面，又有 Coze 的 workflow + 知识库

    如需帮助对接，告诉我。
